apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: OmniRoute/payment-service
          ports:
            - containerPort: 9004
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          env:
            - name: PAYPAL_RETURN_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYPAL_RETURN_URL
            - name: PAYPAL_CANCEL_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PAYPAL_CANCEL_URL
            # PayPal credentials
            - name: PAYPAL_CLIENT_ID
              valueFrom:
                 secretKeyRef:
                   name: paypal-secrets
                   key: paypal-client-id
            - name: PAYPAL_SECRET
              valueFrom:
                 secretKeyRef:
                   name: paypal-secrets
                   key: paypal-secret

            # RabbitMQ credentials
            - name: RABBITMQ_URI
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: uri
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - port: 9004
      name: grpc
      targetPort: 9004
  type: ClusterIP